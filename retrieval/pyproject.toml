[project]
name = "retrieval"
version = "0.1.0"
description = "Pesquisa e extração de receitas reais da web"
requires-python = ">=3.11"
dependencies = ["mise", "pyyaml>=6.0", "rapidfuzz>=3.10"]

[project.optional-dependencies]
# A busca semântica: o modelo multilíngue pelo FastEmbed (ONNX, sem PyTorch). É
# opcional: sem ele, a busca usa os n-gramas, e o modelo só carrega na primeira
# consulta que precisar dele (`retrieval.corpus.vetores`).
semantico = ["fastembed>=0.8"]
dev = ["pytest>=9.1.1", "pytest-cov>=6.0", "hypothesis>=6.112", "mypy>=1.13", "ruff>=0.16.8", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval"]

[tool.coverage.run]
source = ["retrieval"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = ["pragma: sem cobertura", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/retrieval"]

# O PyYAML não publica tipos no próprio pacote; os stubs vêm de `types-PyYAML`,
# nas dependências de desenvolvimento. Sem o extra `dev`, o erro seria sobre stub
# ausente e não sobre o código. Só este import perde verificação.
[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

# O FastEmbed é importado só na hora de carregar o modelo, e o NumPy vem com ele
# (e é citado pelos stubs do `rapidfuzz`). Os stubs do NumPy usam sintaxe do
# Python 3.12 e o mypy aqui verifica para 3.11: sem esta linha, instalar o extra
# `semantico` quebrava a verificação de tipos. Nenhum código daqui usa o NumPy.
[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*", "numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PL", "RUF", "SIM", "TID", "PT", "ARG"]

[tool.ruff.lint.per-file-ignores]
# ARG002: `handle_starttag(tag, attrs)` e `handle_endtag(tag)` são a assinatura
# do `HTMLParser` da biblioteca padrão. Alguns handlers não usam `tag` porque já
# filtraram antes; renomear para `_tag` quebraria o contrato.
"src/retrieval/extrator.py" = ["ARG002"]
# PLC0415: import local em teste mantém o caso autocontido e é padrão comum.
"tests/**" = ["ANN", "PLR2004", "S101", "SIM300", "E501", "PLC0415"]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true
