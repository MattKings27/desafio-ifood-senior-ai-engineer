[project]
name = "auditor"
version = "1.0.0"
description = "Par A2A que confere CMV e preço de forma independente"
requires-python = ">=3.11"
# **Não depende de `mise`.** É a propriedade central deste pacote: conferir a
# conta com o mesmo código que a produziu não é auditoria, é tautologia.
dependencies = ["fastapi>=0.141.1", "uvicorn>=0.32", "pydantic>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-cov>=6.0", "httpx>=0.27", "mypy>=1.13", "ruff>=0.16.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auditor"]

[tool.coverage.run]
source = ["auditor"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = ["pragma: sem cobertura", "if TYPE_CHECKING:", 'if __name__ == "__main__":']
omit = ["*/servidor.py:main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/auditor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PL", "RUF", "SIM", "TID", "PT", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "S101", "SIM300", "E501", "PLC0415"]
