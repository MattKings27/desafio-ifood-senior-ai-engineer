[project]
name = "mise"
version = "0.1.0"
description = "Motor determinístico de custo, viabilidade e precificação para o Sabor da Maria"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "openpyxl>=3.1",
    "rapidfuzz>=3.10",
    "mcp>=2.2.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "ruff>=0.16.8",
    "types-openpyxl>=3.1",
]

[project.scripts]
mise = "mise.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/mise"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_explicit = false

# O extra `retrieval[semantico]` (busca semântica) instala o NumPy, que os stubs do
# `rapidfuzz` citam. Os stubs do NumPy usam sintaxe do Python 3.12 e o mypy aqui
# verifica para 3.11: sem esta linha, instalar o extra quebrava a verificação de
# tipos inteira. Nenhum código deste pacote usa o NumPy.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# `×`, `÷` e `−` são intencionais: as derivações de custo usam os sinais
# matemáticos corretos, não ASCII aproximado. Os travessões aparecem só onde o
# código os procura (a faixa "2–3" de uma receita, os testes que conferem que
# nenhum texto dela usa travessão). Sem isto o RUF002 acusa cada um deles.
allowed-confusables = ["×", "÷", "—", "–", "≥", "≤", "−"]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "PL"]
# N818 exige sufixo `Error` em exceções. O código é escrito em português e a
# hierarquia usa o prefixo `Erro` (ErroDeDados, ErroDeRegra), que é a forma
# natural na língua e mantém a leitura consistente com o resto do domínio.
ignore = ["ANN401", "PLR0913", "N818"]

[tool.ruff.lint.per-file-ignores]
# PLC0415: import local em teste mantém o caso autocontido e é padrão comum.
"tests/**" = ["ANN", "PLR2004", "S101", "SIM300", "E501", "PLC0415"]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true
