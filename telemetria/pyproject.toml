[project]
name = "telemetria"
version = "0.1.0"
description = "Rastro, métricas e custo da execução do agente"
requires-python = ">=3.11"
dependencies = ["opentelemetry-api>=1.27"]

[project.optional-dependencies]
# O SDK é opcional de propósito: a instrumentação usa a **API**, que é um no-op
# sem SDK. Quem só quer rodar o agente não precisa de coletor nenhum; quem quer
# exportar instala este extra e configura OTEL_EXPORTER_OTLP_ENDPOINT.
exportar = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]
dev = ["pytest>=9.1.1", "pytest-cov>=6.0", "mypy>=1.13", "ruff>=0.16.8", "opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telemetria"]

[tool.coverage.run]
source = ["telemetria"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = ["pragma: sem cobertura", "if TYPE_CHECKING:"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/telemetria"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PL", "RUF", "SIM", "TID", "PT", "ARG"]
allowed-confusables = ["×", "÷", "—", "–", "≥", "≤", "−"]

# N818: as exceções deste repositório são nomeadas pelo que aconteceu, em
# português. `ModeloDesconhecidoError` seria metade numa língua e metade na outra.
[tool.ruff.lint.pep8-naming]
ignore-names = ["ModeloDesconhecido"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "S101", "SIM300", "E501", "PLC0415"]
