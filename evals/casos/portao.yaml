    modo_preparo: ["Cozinhe o peixe na panela por 20 minutos."]
  espera:
    veredito: BLOQUEADO
    impedimento_contendo: "preço de referência"

- nome: preco_dela_vale_mais_que_a_referencia
  descricao: >
    O mesmo peixe, com o preço que ela disse (R$ 20,00): o dela vence o de
    referência, a compra cabe nos R$ 30,00, e o prato volta a dar.
  perfil: completo
  gosto: gosta
