# Casos dourados do portão de viabilidade.
#
# Cada caso é uma afirmação sobre o que o sistema **deve** decidir. O valor deles
# não está em passar: está em quebrar quando alguém mudar o comportamento sem
# perceber. Um caso que nunca quebrou não provou nada ainda.
#
# `veredito` usa os rótulos que o motor devolve, não os nomes internos do enum,
# porque é o rótulo que chega à Dona Maria.

- nome: prato_simples_com_tudo_respondido
  descricao: O caminho feliz. Se este quebrar, quebrou o básico.
  perfil: completo
  gosto: gosta
  receita:
    nome: Arroz simples
    rendimento_porcoes: 2
    ingredientes:
      - { texto: "1 xícara de arroz", nome: "arroz", quantidade: 1, medida: "xicara" }
      - { texto: "sal a gosto", nome: "sal" }
    modo_preparo: ["Refogue o arroz e cozinhe na panela por 20 minutos."]
  espera:
    veredito: APTO
    permite_precificar: true

- nome: sem_modo_de_preparo_pergunta_como_ela_faz
  descricao: >
    Sem preparo não há equipamento a conferir, e "nada a conferir" não é "pode
    fazer". Um bolo colado só com a lista de ingredientes saía APTO sem ninguém
    perguntar do forno.
  perfil: completo
  gosto: gosta
  receita:
    nome: Bolo de cenoura
    rendimento_porcoes: 8
    ingredientes:
      - { texto: "2 xícaras de farinha de trigo", nome: "farinha de trigo", quantidade: 2, medida: "xicara" }
      - { texto: "3 ovos", nome: "ovos", quantidade: 3, medida: "ovo" }
  espera:
    veredito: FALTA INFO
    permite_precificar: false
    pergunta_contendo: "Como a senhora faz"

- nome: sem_forno_pergunta_pelo_substituto
  descricao: >
    "Não tenho forno" levava de volta a "a senhora tem forno?". A pergunta útil
    é pela air fryer, que resolve a mesma receita.
  perfil: so_sem_forno
  gosto: gosta
  receita:
    nome: Frango assado
    rendimento_porcoes: 4
    ingredientes:
      - { texto: "500 g de peito de frango", nome: "peito de frango", quantidade: 500, medida: "g" }
    modo_preparo: ["Leve ao forno a 180 C por 40 minutos."]
  espera:
    veredito: FALTA INFO
    permite_precificar: false
    pergunta_contendo: "air fryer"

- nome: rendimento_nao_informado_vira_pergunta
  descricao: >
    Um site que diz "rende 500 g" não diz quantas porções saem. Dividir o custo
    por um número que ninguém informou, sem dizer que é estimativa, é inventar o
    preço. Mudou de veredito: esperava FALTA INFO, e agora é APTO, com o preço
    liberado. O rendimento nunca é pergunta: sem ele na receita, a plataforma
    estima pelo peso dos ingredientes (1 xícara de arroz, cerca de 204 g) e pelo
    peso de uma porção (350 g, premissa que ela muda), diz que é estimativa, e
    ela corrige na receita. Menos de uma porção vira uma: a receita inteira.
  perfil: completo
  gosto: gosta
  receita:
    nome: Arroz simples
    rendimento_informado: false
    ingredientes:
      - { texto: "1 xícara de arroz", nome: "arroz", quantidade: 1, medida: "xicara" }
    modo_preparo: ["Cozinhe na panela por 20 minutos."]
  espera:
    veredito: APTO
    permite_precificar: true
    rendimento_contendo: "cerca de 1 porção (estimativa: porções de 350 g; a senhora pode mudar)"

- nome: forno_desconhecido_vira_pergunta
  descricao: >
    Não saber se ela tem forno não é o mesmo que ela não ter. O portão pergunta,
    e é essa distinção que impede receita viável de ser descartada em silêncio.
  perfil: vazio
  gosto: gosta
  receita:
    nome: Frango assado
    rendimento_porcoes: 4
    ingredientes:
      - { texto: "500 g de peito de frango", nome: "peito de frango", quantidade: 500, medida: "g" }
    modo_preparo: ["Leve ao forno a 180 C por 40 minutos."]
  espera:
    veredito: FALTA INFO
    permite_precificar: false
    pergunta_contendo: "forno"

- nome: sem_forno_nem_substituto_bloqueia
  descricao: Air fryer e forno elétrico também negados, e aí não há saída.
  perfil: sem_forno
  gosto: gosta
  receita:
    nome: Frango assado
    rendimento_porcoes: 4
    ingredientes:
      - { texto: "500 g de peito de frango", nome: "peito de frango", quantidade: 500, medida: "g" }
    modo_preparo: ["Leve ao forno a 180 C por 40 minutos."]
  espera:
    veredito: BLOQUEADO
    permite_precificar: false

- nome: nao_gostar_bloqueia_mesmo_sendo_barato
  descricao: >
    §2.4. Quem cozinha é ela, todo dia. Um prato que ela não quer fazer não entra
    no cardápio por mais barato que o CMV saia.
  perfil: completo
  gosto: nao_gosta
  receita:
    nome: Arroz simples
    rendimento_porcoes: 2
    ingredientes:
      - { texto: "1 xícara de arroz", nome: "arroz", quantidade: 1, medida: "xicara" }
  espera:
    veredito: BLOQUEADO
    permite_precificar: false
    impedimento_contendo: "não gosta"

- nome: gosto_desconhecido_e_a_primeira_pergunta
  descricao: §2.1. É a pergunta mais barata e a que mais elimina.
  perfil: completo
  gosto: desconhecido
  receita:
    nome: Arroz simples
    rendimento_porcoes: 2
    ingredientes:
      - { texto: "1 xícara de arroz", nome: "arroz", quantidade: 1, medida: "xicara" }
  espera:
    veredito: FALTA INFO
    permite_precificar: false
    pergunta_contendo: "gosta de fazer"

- nome: impedimento_dela_bloqueia_mesmo_gostando
  descricao: >
    §2.1, "vê algum impedimento?". Gostar de fazer e conseguir fazer são coisas
    diferentes, e é ela quem sabe a segunda.
  perfil: completo
  gosto: gosta
  impedimento_dela: "meu filho tem alergia e eu não quero esse cheiro na casa"
  receita:
    nome: Arroz simples
    rendimento_porcoes: 2
    ingredientes:
      - { texto: "1 xícara de arroz", nome: "arroz", quantidade: 1, medida: "xicara" }
  espera:
    veredito: BLOQUEADO
    impedimento_contendo: "alergia"

- nome: gas_sem_reserva_bloqueia_fornada_longa
  descricao: §2.2. Acabar o gás no meio estraga o pedido já vendido.
  perfil: completo_sem_gas
  gosto: gosta
  receita:
    nome: Feijoada
    rendimento_porcoes: 8
    tempo_preparo_min: 180
    ingredientes:
      - { texto: "1 kg de feijão preto", nome: "feijao preto", quantidade: 1, medida: "kg" }
    modo_preparo: ["Cozinhe em fogo baixo por 3 horas."]
  espera:
    veredito: BLOQUEADO
    impedimento_contendo: "botijão"

- nome: geladeira_sem_espaco_bloqueia_preparo_que_gela
  descricao: §2.2. O preparo disputa espaço com a comida da casa.
  perfil: completo_sem_geladeira
  gosto: gosta
  receita:
    nome: Pudim
    rendimento_porcoes: 8
    ingredientes:
      - { texto: "3 ovos", nome: "ovos", quantidade: 3, medida: "ovo" }
    modo_preparo: ["Leve à geladeira por 4 horas."]
  espera:
    veredito: BLOQUEADO
    impedimento_contendo: "geladeira"

- nome: tempo_de_preparo_declarado_nao_e_tempo_no_fogo
  descricao: >
    Era tempo_acima_do_limite_bloqueia, e esperava que a feijoada não desse. O
    único tempo desta receita, 180 minutos, é o tempo de preparo que ela
    declara, e o portão antigo o comparava com a hora que ela tem por cozinhada
    como se fosse fogo. Tempo declarado pode trazer o feijão de molho e o
    descanso: dizer "não dá" por ele era afirmar sem saber, o furo que misturava
    o tempo total com o tempo no fogo. Agora conta o tempo dos passos, ou o
    cozimento declarado; esta receita não tem nenhum dos dois, e o portão
    pergunta como ela faz, que é de onde o tempo vem. A mesma feijoada com 180
    minutos de cozimento declarados continua não dando, com a conta no motivo
    (sem_tempo_nos_passos_usa_o_tempo_de_cozimento).
  perfil: completo_rapido
  gosto: gosta
  receita:
    nome: Feijoada
    rendimento_porcoes: 8
    tempo_preparo_min: 180
    ingredientes:
      - { texto: "1 kg de feijão preto", nome: "feijao preto", quantidade: 1, medida: "kg" }
  espera:
    veredito: FALTA INFO
    permite_precificar: false
    pergunta_contendo: "Como a senhora faz"

# a pergunta virou valor pré-determinado com fonte: à Dona Maria só se pergunta gosto, equipamento, técnica e limite operacional.
- nome: ingrediente_sem_preco_fica_de_fora_sem_pergunta
  descricao: >
    Era ingrediente_ausente_pede_o_preco, e esperava FALTA INFO com a pergunta
    do preço. Mudou de veredito: agora é BLOQUEADO. O preço nunca se pergunta:
    a trufa branca não tem preço em página de supermercado, e sem ele não dá
    para confirmar que a compra cabe nos R$ 80,00; a receita fica de fora, com
    o motivo, e o preço dela vale quando ela quiser dizer
    (`registrar_preco_mercado`).
  perfil: completo
  gosto: gosta
  receita:
    nome: Risoto de trufa
    rendimento_porcoes: 4
    ingredientes:
      - { texto: "1 xícara de arroz", nome: "arroz", quantidade: 1, medida: "xicara" }
      - { texto: "20 g de trufa branca", nome: "trufa branca", quantidade: 20, medida: "g" }
  espera:
    veredito: BLOQUEADO
    permite_precificar: false
    impedimento_contendo: "não achei em página de supermercado o preço de trufa branca"

- nome: compra_que_estoura_o_orcamento_bloqueia
  descricao: §2.3. O limite de R$ 80,00 é dela, não uma sugestão.
  perfil: completo
  gosto: gosta
  precos: { "trufa branca": 95.00 }
  orcamento_restante: 10.00
  receita:
    nome: Risoto de trufa
    rendimento_porcoes: 4
    ingredientes:
      - { texto: "1 xícara de arroz", nome: "arroz", quantidade: 1, medida: "xicara" }
      - { texto: "20 g de trufa branca", nome: "trufa branca", quantidade: 20, medida: "g" }
  espera:
    veredito: BLOQUEADO
    impedimento_contendo: "orçamento"

- nome: compra_que_cabe_sem_o_tempo_da_receita_pergunta
  descricao: >
    Era compra_que_cabe_no_orcamento_libera, e esperava "dá, comprando". O
    passo não diz quanto tempo o risoto fica no fogo, a receita não declara
    tempo de cozimento, e ela tem 240 minutos por cozinhada. O portão antigo
    pulava a conta do tempo quando a receita não dizia, e liberava a compra sem
    saber se o prato cabe na cozinhada dela: era dizer que dá sem conferir.
    Mudou de veredito outra vez: esperava FALTA INFO, e agora é APTO COM
    COMPRA. Quatro horas por cozinhada é limite folgado (`LIMITE_FOLGADO_MIN`):
    um risoto cujo passo não diz o tempo cabe nelas, e perguntar era
    interrogatório. O portão não pergunta e avisa que não perguntou; com o
    limite apertado, ele continua perguntando
    (tempo_que_a_receita_nao_diz_com_limite_apertado_pergunta).
  perfil: completo
  gosto: gosta
  precos: { "trufa branca": 18.00 }
  orcamento_restante: 80.00
  receita:
    nome: Risoto de trufa
    rendimento_porcoes: 4
    ingredientes:
      - { texto: "1 xícara de arroz", nome: "arroz", quantidade: 1, medida: "xicara" }
      - { texto: "20 g de trufa branca", nome: "trufa branca", quantidade: 20, medida: "g" }
    modo_preparo: ["Cozinhe o arroz na panela e finalize com a trufa."]
  espera:
    veredito: APTO COM COMPRA
    permite_precificar: true
    aviso_contendo: "não perguntei"

# a pergunta virou valor pré-determinado com fonte: à Dona Maria só se pergunta gosto, equipamento, técnica e limite operacional.
- nome: embalagem_opaca_usa_o_peso_estimado_com_fonte
  descricao: >
    Era embalagem_opaca_vira_pergunta_e_nao_estimativa. A armadilha que deu
    R$ 15.980,00 uma vez: dividir preço por quantidade quando a quantidade é "1
    unidade" e a receita pede gramas. Continua sem divisão por "1 unidade", e
    mudou de veredito: esperava FALTA INFO com a pergunta do peso, e agora é
    APTO. O peso vem estimado pela página do supermercado (a cobertura de 1 kg,
    a de preço mais perto dos R$ 79,90), dito como estimativa: 200 g de R$
    79,90/kg são R$ 15,98, divididos pelas 8 porções.
  perfil: completo
  gosto: gosta
  receita:
    nome: Bolo com cobertura
    rendimento_porcoes: 8
    ingredientes:
      - { texto: "200 g de cobertura de chocolate", nome: "Cobertura de chocolate", quantidade: 200, medida: "g" }
    modo_preparo: ["Derreta a cobertura na panela em fogo baixo por 10 minutos e cubra o bolo."]
  espera:
    veredito: APTO
    permite_precificar: true
    custo_por_porcao: "R$ 2,00"

# --------------------------------------------------------------------------- #
# O que toda cozinha tem, as bocas, o tempo no fogo e o frio pelos passos.
# Cada caso abaixo fecha um furo: com o portão antigo, ele decidia diferente.
# --------------------------------------------------------------------------- #

- nome: compra_que_cabe_com_o_tempo_nos_passos_libera
  descricao: >
    §2.3. Com o preço conhecido, a compra cabendo e o passo dizendo quanto
    tempo o risoto fica no fogo, o prato segue.
  perfil: completo
  gosto: gosta
  precos: { "trufa branca": 18.00 }
  orcamento_restante: 80.00
  receita:
    nome: Risoto de trufa
    rendimento_porcoes: 4
    ingredientes:
      - { texto: "1 xícara de arroz", nome: "arroz", quantidade: 1, medida: "xicara" }
      - { texto: "20 g de trufa branca", nome: "trufa branca", quantidade: 20, medida: "g" }
    modo_preparo: ["Cozinhe o arroz na panela por 25 minutos e finalize com a trufa."]
  espera:
    veredito: APTO COM COMPRA
    permite_precificar: true

- nome: nao_tenho_fogao_bloqueia
  descricao: >
    O fogão é suposto em toda cozinha, e o portão pulava o suposto: com ela
    dizendo que não tem fogão, o arroz refogado continuava "dá pra fazer". O
    "não tenho" dela vale também para o que toda cozinha tem.
  perfil: completo_sem_fogao
  gosto: gosta
  receita:
    nome: Arroz simples
    rendimento_porcoes: 2
    ingredientes:
      - { texto: "1 xícara de arroz", nome: "arroz", quantidade: 1, medida: "xicara" }
      - { texto: "sal a gosto", nome: "sal" }
    modo_preparo: ["Refogue o arroz e cozinhe na panela por 20 minutos."]
  espera:
    veredito: BLOQUEADO
    permite_precificar: false
    impedimento_contendo: "precisa de fogão e a senhora não tem"

- nome: receita_contada_em_primeira_pessoa_sem_fogao_bloqueia
  descricao: >
    A receita que ela conta vem em primeira pessoa ("refogo a cebola, cozinho
    20 minutos"), e o detector só conhecia "refogue" e "cozinhe": sem exigir
    fogão, o "não tenho fogão" dela não bloqueava. As formas em primeira pessoa
    também denunciam o fogão e o refogar.
  perfil: completo_sem_fogao
  gosto: gosta
  receita:
    nome: Arroz com frango da Dona Maria
    rendimento_porcoes: 4
    ingredientes:
      - { texto: "2 xícaras de arroz", nome: "arroz", quantidade: 2, medida: "xicara" }
      - { texto: "sal a gosto", nome: "sal" }
    modo_preparo: ["Refogo a cebola e o alho, junto o arroz e a água e cozinho 20 minutos."]
  espera:
    veredito: BLOQUEADO
    permite_precificar: false
    impedimento_contendo: "precisa de fogão e a senhora não tem"

- nome: nao_sei_do_fogao_pergunta
  descricao: >
    "Não sei se tenho fogão" voltava o fogão a suposto, e a receita passava sem
    ninguém saber se havia fogão. O "não sei" fica em aberto, e o portão
    pergunta quando a receita precisa.
  perfil: completo_sem_saber_do_fogao
  gosto: gosta
  receita:
    nome: Arroz simples
    rendimento_porcoes: 2
    ingredientes:
      - { texto: "1 xícara de arroz", nome: "arroz", quantidade: 1, medida: "xicara" }
      - { texto: "sal a gosto", nome: "sal" }
    modo_preparo: ["Refogue o arroz e cozinhe na panela por 20 minutos."]
  espera:
    veredito: FALTA INFO
    permite_precificar: false
    pergunta_contendo: "tem fogão"

- nome: nao_faco_tecnica_basica_bloqueia
  descricao: >
    A técnica que toda cozinheira faz também passa pelo portão: o "não faço"
    dela bloqueia com o motivo, como bloqueia a técnica difícil.
  perfil: completo_sem_refogar
  gosto: gosta
  receita:
    nome: Arroz simples
    rendimento_porcoes: 2
    ingredientes:
      - { texto: "1 xícara de arroz", nome: "arroz", quantidade: 1, medida: "xicara" }
      - { texto: "sal a gosto", nome: "sal" }
    modo_preparo: ["Refogue o arroz e cozinhe na panela por 20 minutos."]
  espera:
    veredito: BLOQUEADO
    impedimento_contendo: "pede refogar, que a senhora disse não fazer"

- nome: aceite_espera_ela_confirmar_o_que_toda_cozinha_tem
  descricao: >
    §2.2: antes de aceitar um prato, garantir que ela consegue produzi-lo. O
    fogão e o refogar são supostos (ninguém pergunta item por item a uma
    cozinheira de mão cheia), e a grade continua dizendo que dá. Mas suposto não
    é garantia: o aceite é recusado até ela confirmar, numa pergunta só, o que a
    receita usa disso.
  perfil: completo_basico_suposto
  gosto: gosta
  receita:
    nome: Arroz simples
    rendimento_porcoes: 2
    ingredientes:
      - { texto: "1 xícara de arroz", nome: "arroz", quantidade: 1, medida: "xicara" }
      - { texto: "sal a gosto", nome: "sal" }
    modo_preparo: ["Refogue o arroz e cozinhe na panela por 20 minutos."]
  espera:
    veredito: APTO
    permite_precificar: true
    aceite: recusado
    confirmar_a_cozinha: [fogao, refogar]
    pergunta_do_aceite: "Antes de aceitar, a senhora confirma que tem fogão e que sabe refogar?"

- nome: aceite_liberado_depois_que_ela_confirma
  descricao: >
    Ela respondeu que sim, num toque: o fogão e o refogar passam a ser ditos por
    ela, e o mesmo prato pode ser aceito. Nada mais é perguntado.
  perfil: completo_basico_suposto
  confirmou: [fogao, refogar]
  gosto: gosta
  receita:
    nome: Arroz simples
    rendimento_porcoes: 2
    ingredientes:
      - { texto: "1 xícara de arroz", nome: "arroz", quantidade: 1, medida: "xicara" }
      - { texto: "sal a gosto", nome: "sal" }
    modo_preparo: ["Refogue o arroz e cozinhe na panela por 20 minutos."]
  espera:
    veredito: APTO
    permite_precificar: true
    aceite: liberado
    confirmar_a_cozinha: []

- nome: aceite_nao_pede_o_que_a_receita_nao_usa
  descricao: >
    O bolo de liquidificador não usa nada do que toda cozinha tem: o
    liquidificador e o forno ela respondeu. Com o fogão ainda suposto, o aceite
    não pergunta dele, porque a receita não precisa: só se pergunta o que decide.
  perfil: completo_basico_suposto
  gosto: gosta
  receita:
    nome: Bolo de liquidificador
    rendimento_porcoes: 8
    tempo_cozimento_min: 40
    ingredientes:
      - { texto: "3 ovos", nome: "ovos", quantidade: 3, medida: "ovo" }
    modo_preparo: ["Bata tudo no liquidificador.", "Leve ao forno por 40 minutos."]
  espera:
    veredito: APTO
    permite_precificar: true
    aceite: liberado
    confirmar_a_cozinha: []

- nome: outra_panela_com_uma_boca_avisa_sem_bloquear
  descricao: >
    "Em outra panela" pede duas bocas acesas ao mesmo tempo, e o portão não lia
    isso. Com uma boca só, ela faz uma parte depois da outra: dá do mesmo
    jeito, leva mais tempo, e isso vira aviso, não bloqueio.
  perfil: completo_uma_boca
  gosto: gosta
  receita:
    nome: Macarrão ao sugo
    rendimento_porcoes: 2
    ingredientes:
      - { texto: "200 g de macarrão espaguete", nome: "macarrão espaguete", quantidade: 200, medida: "g" }
      - { texto: "300 g de tomate", nome: "tomate", quantidade: 300, medida: "g" }
      - { texto: "10 g de alho", nome: "alho", quantidade: 10, medida: "g" }
      - { texto: "sal a gosto", nome: "sal" }
    modo_preparo:
      - "Cozinhe o macarrão em água fervente por 10 minutos."
      - "Em outra panela, refogue o alho e junte o tomate; cozinhe por 15 minutos."
  espera:
    veredito: APTO
    permite_precificar: true
    aviso_contendo: "Com uma boca, a senhora faz uma parte depois da outra e leva mais tempo"

- nome: outra_panela_com_duas_bocas_passa_sem_aviso
  descricao: Com duas bocas, as duas panelas andam juntas, e não há o que avisar.
  perfil: completo_duas_bocas
  gosto: gosta
  receita:
    nome: Macarrão ao sugo
    rendimento_porcoes: 2
    ingredientes:
      - { texto: "200 g de macarrão espaguete", nome: "macarrão espaguete", quantidade: 200, medida: "g" }
      - { texto: "300 g de tomate", nome: "tomate", quantidade: 300, medida: "g" }
