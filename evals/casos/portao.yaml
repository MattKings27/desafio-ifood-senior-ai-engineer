- nome: preco_de_referencia_que_cabe_libera_a_compra
  descricao: >
    Ela não disse quanto custa o creme de leite. O preço médio em São Paulo,
    a média do quilo em seis supermercados de São Paulo (R$ 16,60 o quilo, a
    caixinha de 200 g por R$ 3,32), cota a compra, diz que é referência e com
    que fontes, e a compra cabe nos R$ 80,00: dá, comprando, sem perguntar o
    preço. Mudou de número quando o preço de um mercado só virou a média de São
    Paulo: era R$ 2,75 por porção com os R$ 3,99 de um mercado.
