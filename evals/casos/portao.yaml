  receita:
    nome: Peixe na panela
    rendimento_porcoes: 4
    ingredientes:
      - { linha: "1 kg de filé de pescada" }
    modo_preparo: ["Cozinhe o peixe na panela por 20 minutos."]
  espera:
    veredito: APTO COM COMPRA
    permite_precificar: true

# a pergunta virou valor pré-determinado com fonte: à Dona Maria só se pergunta gosto, equipamento, técnica e limite operacional.
- nome: xicara_de_coco_ralado_pela_tabela_do_usda_cota_a_compra
  descricao: >
    Era referencia_que_nao_se_compara_continua_perguntando, e esperava FALTA
    INFO com a pergunta do preço. Mudou de veredito: agora é APTO COM COMPRA.
    A xícara de coco ralado pesa 93 g pela tabela de porções do USDA (linha
    citada e conferida), e com o peso o preço de referência do pacote de 100 g
    cota a compra, que cabe nos R$ 80,00.
  perfil: completo
  gosto: gosta
  receita:
    nome: Cocada de panela
    rendimento_porcoes: 8
    ingredientes:
      - { linha: "1 xícara de coco ralado" }
      - { linha: "1 xícara de açúcar" }
    modo_preparo: ["Cozinhe o coco com o açúcar na panela por 20 minutos, mexendo."]
  espera:
    veredito: APTO COM COMPRA
    permite_precificar: true
    situacao: { "coco ralado": falta }

- nome: pacote_da_receita_e_o_pacote_da_planilha_dela
  descricao: >
    "1 pacote de feijão preto": a planilha dela diz que ela comprou o feijão
    preto em 1 kg de uma vez, e esse é o pacote. A conta sai sem perguntar
    quanto pesa o pacote: 1 kg × R$ 9,60/kg, dividido pelas 4 porções.
  perfil: completo
  gosto: gosta
  receita:
    nome: Feijão preto simples
    rendimento_porcoes: 4
    ingredientes:
      - { linha: "1 pacote de feijão preto" }
    modo_preparo: ["Cozinhe o feijão na panela de pressão por 40 minutos."]
  espera:
    veredito: APTO
    permite_precificar: true
    custo_por_porcao: "R$ 2,40"
    situacao: { "Feijão preto": tem }

# a pergunta virou valor pré-determinado com fonte: à Dona Maria só se pergunta gosto, equipamento, técnica e limite operacional.
- nome: medida_que_o_ibge_nao_diz_vem_da_tabela_do_usda
  descricao: >
    Era medida_que_a_tabela_nao_diz_continua_perguntando, e esperava FALTA INFO
    com "Não sei quanto pesa uma colher de sopa de alcaparras". Mudou de
    veredito: agora é APTO. A tabela do IBGE diz a colher de sobremesa de
    alcaparras, e não a de sopa; a tabela de porções do USDA diz (8,6 g a colher
    de sopa, escorrida), e a medida sai com a fonte, sem pergunta.
  perfil: completo
  gosto: gosta
  receita:
    nome: Frango com alcaparras
    rendimento_porcoes: 4
    ingredientes:
      - { linha: "500 g de peito de frango" }
      - { linha: "2 colheres de sopa de alcaparras" }
    modo_preparo: ["Grelhe o frango na frigideira por 15 minutos e junte as alcaparras."]
  espera:
    veredito: APTO
    permite_precificar: true
    situacao: { "Alcaparras": tem }

- nome: tempo_que_a_receita_nao_diz_com_limite_folgado_nao_pergunta
  descricao: >
    Ela disse que tem 10 horas por cozinhada. A receita não diz quanto tempo o
    risoto fica no fogo, e com 4 horas ou mais o portão não pergunta: passa, e
    avisa que não perguntou.
  perfil: completo_dez_horas
  gosto: gosta
  receita:
    nome: Arroz de panela
    rendimento_porcoes: 4
    ingredientes:
      - { linha: "2 xícaras de arroz" }
    modo_preparo: ["Refogue o arroz e cozinhe na panela até secar."]
  espera:
    veredito: APTO
    permite_precificar: true
    aviso_contendo: "não perguntei"

# a pergunta virou valor pré-determinado com fonte: à Dona Maria só se pergunta gosto, equipamento, técnica e limite operacional.
- nome: tempo_que_a_receita_nao_diz_com_limite_apertado_fica_de_fora
  descricao: >
    Era tempo_que_a_receita_nao_diz_com_limite_apertado_pergunta, e esperava
    FALTA INFO com "Pelos passos não dá para saber quanto tempo". Mudou de
    veredito: agora é BLOQUEADO. Com uma hora por cozinhada, o limite é
    apertado; o tempo da receita não se pergunta, e sem ele não dá para
    confirmar que cabe: a receita fica de fora, com o motivo, e ela diz o
    tempo na receita se quiser. A segurança da cozinha fica igual: nada
    libera preço nem compra sem saber que cabe.
  perfil: completo_rapido
  gosto: gosta
  receita:
    nome: Arroz de panela
    rendimento_porcoes: 4
    ingredientes:
      - { linha: "2 xícaras de arroz" }
    modo_preparo: ["Refogue o arroz e cozinhe na panela até secar."]
  espera:
    veredito: BLOQUEADO
    permite_precificar: false
    impedimento_contendo: "não dá para confirmar que cabe"

- nome: rendimento_estimado_pelo_peso_dos_ingredientes
  descricao: >
    O rendimento não é perguntado. A receita não diz quantas porções rende: 1
    pacote de feijão preto (o pacote dela, 1 kg) e 2 litros de água pesam cerca
    de 3 kg, e com porções de 350 g saem cerca de 9. O texto diz que é
    estimativa e que ela pode mudar; o custo por porção sai dividido por 9.
  perfil: completo
  gosto: gosta
  receita:
    nome: Feijão preto de panela
    rendimento_informado: false
    ingredientes:
      - { linha: "1 pacote de feijão preto" }
      - { linha: "2 litros de água" }
    modo_preparo: ["Cozinhe o feijão na panela de pressão por 40 minutos."]
  espera:
    veredito: APTO
    permite_precificar: true
    rendimento_contendo: "cerca de 9 porções (estimativa: porções de 350 g; a senhora pode mudar)"
    custo_por_porcao: "R$ 1,07"

# ---------------------------------------------------------------------------
# A plataforma decide e diz de onde tirou: o casamento, a marca, a quantidade
# que a receita não diz e a medida caseira sem fonte própria.
# ---------------------------------------------------------------------------

- nome: mandioca_nao_e_farinha_de_mandioca
  descricao: >
    A forma do produto decide: farinha é outro produto que o ingrediente cru.
    "1 kg de mandioca cozida" não é a farinha de mandioca dela: vira compra, e a
    decisão fica dita ("considerei que mandioca não é a sua farinha de
    mandioca"), corrigível. Nunca um falso "ela tem".
  perfil: completo
  gosto: gosta
  precos: { "mandioca": 8.00 }
  orcamento_restante: 80.00
  receita:
    nome: Mandioca cozida
    rendimento_porcoes: 4
    ingredientes:
      - { linha: "1 kg de mandioca cozida com sal" }
    modo_preparo: ["Cozinhe a mandioca na panela de pressão por 20 minutos."]
  espera:
    veredito: APTO COM COMPRA
    permite_precificar: true
    situacao: { "mandioca": falta }

- nome: marca_nao_muda_o_ingrediente
  descricao: >
    "Queijo Parmesão TIROLEZ ralado" é o queijo parmesão ralado dela: a marca
    sai antes de casar, e a linha usa o que ela tem, sem pergunta.
  perfil: completo
  gosto: gosta
  receita:
    nome: Polenta com queijo
    rendimento_porcoes: 4
    ingredientes:
      - { linha: "1 xícara (chá) de fubá" }
      - { linha: "3 colheres (sopa) de Queijo Parmesão TIROLEZ ralado" }
    modo_preparo: ["Cozinhe o fubá na panela por 30 minutos, mexendo, e junte o queijo."]
  espera:
    veredito: APTO
    permite_precificar: true
    situacao: { "Queijo parmesão ralado": tem, "Polenta (fubá)": tem }

- nome: linha_sem_quantidade_vira_estimativa_com_fonte
  descricao: >
    "Milho", sem quantidade, em "Frango xadrez à minha moda": a receita não diz
    quanto, e a plataforma considera a unidade de venda, a lata de 170 g da
    página do produto que cota a compra, dita como estimativa e corrigível. A
    compra cabe nos R$ 80,00, e nada se pergunta.
  perfil: completo
  gosto: gosta
  orcamento_restante: 80.00
  receita:
    nome: Frango xadrez
    rendimento_porcoes: 4
    ingredientes:
      - { linha: "500 g de peito de frango" }
      - { linha: "Milho" }
    modo_preparo: ["Refogue o frango na panela por 20 minutos e junte o milho."]
  espera:
    veredito: APTO COM COMPRA
    permite_precificar: true
    situacao: { "Peito de frango": tem, "Milho": falta }

- nome: medida_caseira_sem_fonte_propria_usa_a_classe
  descricao: >
    Nenhuma tabela diz quanto pesa um maço de couve: vale a classe das verduras
    de folha, com a base citada (o maço de alface da tabela do IBGE, 200 g),
    dita como estimativa. A linha usa a couve dela, sem pergunta.
  perfil: completo
  gosto: gosta
  receita:
    nome: Couve refogada
    rendimento_porcoes: 4
    ingredientes:
      - { linha: "1 maço de couve" }
      - { linha: "2 dentes de alho" }
    modo_preparo: ["Refogue o alho e a couve na frigideira por 5 minutos."]
  espera:
    veredito: APTO
    permite_precificar: true
    situacao: { "Couve": tem }

- nome: couro_do_bacon_e_o_bacon_dela
  descricao: >
    "1 couro do bacon" é a pele da mesma peça do bacon dela, como o coração da
    alcatra é o miolo: a linha usa o bacon da despensa, com a decisão dita
    ("Considerei que couro do bacon é o seu bacon...") e o peso de um pedaço de
    toucinho pela tabela do IBGE (10 g), estimativa que ela corrige. Nada vira
    compra nem pergunta.
  perfil: completo
  gosto: gosta
  receita:
    nome: Feijão com couro do bacon
    rendimento_porcoes: 4
    ingredientes:
      - { linha: "500 g de feijão carioca" }
      - { linha: "1 couro do bacon" }
    modo_preparo: ["Cozinhe o feijão com o couro do bacon na panela de pressão por 40 minutos."]
  espera:
    veredito: APTO
    permite_precificar: true
    situacao: { "Bacon": tem, "Feijão carioquinha": tem }
