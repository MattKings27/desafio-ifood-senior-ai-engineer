# ---------------------------------------------------------------------------
# O parecido pergunta, o peito da receita de frango e a água da torneira
# ---------------------------------------------------------------------------

# a pergunta virou valor pré-determinado com fonte: à Dona Maria só se pergunta gosto, equipamento, técnica e limite operacional.
- nome: parecido_vira_compra_com_a_decisao_dita
  descricao: >
    Era parecido_pergunta_em_vez_de_virar_tem_ou_compra, e esperava FALTA INFO
    com "A receita pede canela. É a sua canela em pó?". Mudou de veredito: agora
    é APTO COM COMPRA. "Canela" pode ser em pau, e em pó é outra forma do
    produto: o parecido nunca vira "tem", a regra decide pelo lado seguro (não
    é o dela, vira compra) e a decisão fica dita e corrigível. O preço da canela
    vem do caso, para o veredito não depender do arquivo de referências.
  perfil: completo
  gosto: gosta
  precos: { "canela": 5.00 }
  orcamento_restante: 80.00
  receita:
    nome: Arroz doce com canela
    rendimento_porcoes: 4
    ingredientes:
      - { linha: "1 xícara de arroz" }
      - { linha: "1 colher de sopa de canela" }
    modo_preparo: ["Cozinhe o arroz na panela por 20 minutos e polvilhe a canela."]
  espera:
    veredito: APTO COM COMPRA
    permite_precificar: true
    situacao: { "canela": falta }

- nome: peito_na_receita_de_frango_e_o_peito_dela
  descricao: >
    Verificação real. "1 peito cortado em 4 filés" em "Frango com alcaparras"
    saía como compra de um peito, com o peito de frango na despensa dela. Numa
    receita de frango, o peito é o dela. Mudou de veredito: esperava FALTA
    INFO (o peso de um peito e o preço do limão), e agora é APTO COM COMPRA. O
    peso de um peito sai da tabela de medidas do IBGE (180 g, que ela pode
    corrigir), e o limão, que falta, sai do preço de referência conferido na
    página do supermercado; a compra cabe nos R$ 80,00.
  perfil: completo
  gosto: gosta
  receita:
    nome: Frango com alcaparras
    rendimento_porcoes: 4
    ingredientes:
      - { linha: "1 peito cortado em 4 filés" }
      - { linha: "Suco de 1 limão" }
    modo_preparo: ["Tempere o frango com o limão e frite na frigideira por 15 minutos."]
  espera:
    veredito: APTO COM COMPRA
    permite_precificar: true
    situacao: { "Peito de frango": tem, "limão": falta }

- nome: peso_informado_por_ela_destrava_o_custo
  descricao: >
    Verificação real. Sem o peso de "1 peito cortado em 4 filés", a conferência
    perguntava quanto pesa um peito e o prato não tinha custo; ela respondia e
    não havia onde gravar. Mudou de veredito antes da resposta: esperava FALTA
    INFO, e agora é APTO, porque a tabela de medidas do IBGE diz o peso de um
    peito (180 g), com a incerteza de medida caseira. O peso dela continua
    valendo mais: com "300 g" dito por ela, o custo sai do peso que ela disse,
    300 g × R$ 14,00/kg do peito da despensa, dividido pelas 2 porções.
  perfil: completo
  gosto: gosta
  receita:
    nome: Frango com alcaparras
    rendimento_porcoes: 2
    ingredientes:
      - { linha: "1 peito cortado em 4 filés" }
      - { linha: "sal a gosto" }
    modo_preparo: ["Tempere os filés com sal e grelhe na frigideira por 15 minutos."]
  antes_da_resposta:
    veredito: APTO
    permite_precificar: true
  resposta_dela:
    - { linha: "1 peito cortado em 4 filés", peso: "300 g" }
  espera:
    veredito: APTO
    permite_precificar: true
    custo_por_porcao: "R$ 2,10"
    situacao: { "Peito de frango": tem }

- nome: agua_da_torneira_nao_entra_na_compra
  descricao: >
    Verificação real. "1/2 xícara de água" virava "Falta comprar: água" e a
    pergunta do preço da água. A água da torneira vai na receita e não se compra.
  perfil: completo
  gosto: gosta
  receita:
    nome: Arroz simples com água
    rendimento_porcoes: 2
    ingredientes:
      - { linha: "1 xícara de arroz" }
      - { linha: "2 xícaras de água" }
    modo_preparo: ["Refogue o arroz e cozinhe na panela por 20 minutos."]
  espera:
    veredito: APTO
    permite_precificar: true
    situacao: { "água": tem }

