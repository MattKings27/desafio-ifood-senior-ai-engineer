  nota: marmita e entrega são sinônimos de embalagem e de delivery

- id: parafrase-contas-do-mes
  pergunta: Como sei se o que eu vendo paga as contas do mês?
  esperados: [conhecimento:ponto-de-equilibrio, conhecimento:rateio-dos-custos-fixos-no-prato]
  nota: >
    paráfrase sem nenhuma palavra do trecho; os dois braços dizem "não sei", que
    é o erro mais barato
  conhecido: true

