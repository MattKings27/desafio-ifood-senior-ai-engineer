# -- paráfrases, sem as palavras do trecho --------------------------------------

- id: parafrase-comida-quente
  pergunta: Por quanto tempo a comida pode ficar quentinha esperando o cliente?
  esperados: [conhecimento:manter-quente-acima-de-60-graus, conhecimento:abaixo-de-60-graus-consumir-em-1-hora]
  nota: >
    paráfrase; o trecho fala em manter acima de 60 graus. Os n-gramas não acham,
    o modelo multilíngue acha
  conhecido: true

- id: parafrase-esfriar-rapido
  pergunta: Como esfrio a panela rápido antes de guardar na geladeira?
  esperados: [conhecimento:esfriar-panela-em-agua-com-gelo, conhecimento:resfriar-de-60-a-10-graus-em-2-horas]

- id: parafrase-levar-ao-cliente
