# O conjunto dourado da busca da plataforma (`python -m evals.recuperacao`).
#
# Cada pergunta é feita no estado de referência (`evals.recuperacao.montar_estado`):
# a planilha dela, uma cozinha com respostas pela tela e pela conversa, quatro
# receitas em avaliação, uma decisão, uma compra, um preço e o leite que acabou,
# mais a base de cozinha com fonte.
#
# `esperados` são os trechos que respondem à pergunta; qualquer um deles conta.
# Sem `esperados`, a pergunta é de fora da plataforma e a resposta certa é
# "não sei". `nota` diz o que o caso testa.

# -- despensa ---------------------------------------------------------------

- id: despensa-quanto-paguei
  pergunta: Quanto eu paguei nas alcaparras?
  esperados: [despensa:alcaparras]
  nota: nome do item e verbo no passado (paguei e pagou)

- id: despensa-custo-do-azeite
  pergunta: Quanto sai o litro do azeite que eu comprei?
  esperados: [despensa:azeite-de-oliva-extra-virgem]

- id: despensa-leite-acabou
  pergunta: Ainda tenho leite?
  esperados: [despensa:leite-integral]
  nota: o item que acabou continua na despensa, com o estoque zerado

- id: despensa-carnes
  pergunta: Que carnes eu tenho na despensa?
  esperados: [despensa:carne-moida-patinho, despensa:carne-de-panela-acem, despensa:miolo-de-alcatra]
  tipos: [despensa]
  nota: filtro por tipo e vários trechos certos

- id: despensa-dinheiro-parado
  pergunta: Quanto dinheiro eu tenho parado na despensa no total?
  esperados: [despensa:resumo]

- id: despensa-pendencia
  pergunta: O que falta eu dizer sobre a cobertura de chocolate?
  esperados: [despensa:cobertura-de-chocolate]

- id: despensa-linha-da-planilha
  pergunta: Em que linha da planilha está o bacon?
  esperados: [despensa:bacon]

- id: despensa-sinonimo
  pergunta: Tenho muçarela em casa?
  esperados: [despensa:queijo-mussarela]
  nota: sinônimo do casamento de ingrediente (muçarela e mussarela)

